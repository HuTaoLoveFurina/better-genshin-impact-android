# bgia configuration example. Copy to config.yaml and edit as needed, then pass it with `-c config.yaml` at runtime.

# ---------------- Connection ----------------
# serial: "192.168.1.20:5555"   # Target device; required when multiple devices are connected, can be empty for a single device
# wireless: "192.168.1.20:5555" # If set, automatically runs `adb connect`
adb_path: adb

# Force a specific package name; leave empty to auto-detect
# CN official: com.miHoYo.Yuanshen / Bilibili: com.miHoYo.ys.bilibili
# Global:      com.miHoYo.GenshinImpact / Cloud Genshin: com.miHoYo.cloudgames.ys
# package: com.miHoYo.Yuanshen

# ---------------- Language ----------------
# Genshin client language. Determines the OCR model and localized story keywords.
# Supported: zh-CN(zh-Hans) zh-TW(zh-Hant) ja ko en fr de
#            ru es pt it tr id vi th(th unreliable)
# Defaults to zh-CN when omitted. Recognition families use PP-OCRv4 mobile models on demand.
lang: zh-CN

# ---------------- Loop ----------------
interval: 0.6        # Main loop interval (seconds); for cloud-Genshin streaming, raise to 0.8~1.0
click_delay: 0.15    # Wait after each tap

# ---------------- Dialogue options ----------------
choose_option: true
option_mode: first   # first / second / last / random / none
before_choose_delay: 0.0   # Extra wait before clicking an option; set 2~3 to listen to the voice line

# Custom priority options: if the text contains any of these, click it first
custom_priority: []
#  - "继续深入"
#  - "我准备好了"

# Pause auto-tapping when any of these words are hit, leaving it to manual control (avoids mis-clicking consumable options)
pause_keywords:
  - 退出秘境
  - 放弃
  - 离开
  - 购买
  - 兑换
  - 传送

prefer_orange: false # Optional preference for orange key-story options; matches the built-in default

# ---------------- Behavior switches ----------------
quick_skip: true          # Rapid tapping only during an active Talk state
click_black_screen: true  # Tap during black-screen cinematics
auto_hangout_skip: true   # Auto-click skip on hangout screens
close_popup: true         # Auto-close pop-up pages
click_continue: true       # Auto-tap on "click anywhere to continue" prompts (e.g. Fontaine main story)

# ---------------- Dialogue-state detection ----------------
talk_grace_seconds: 10.0   # Safe post-dialogue window for pop-ups and continue prompts
legacy_talk_detection: true # Keep stop_auto and playing-text fallbacks for Android/cloud clients

# ---------------- Thresholds ----------------
template_threshold: 0.80  # Template-match threshold; raise if false positives, lower if not detected
quick_teleport_threshold: 0.80 # Map-template threshold; validated in the safe 0.75~1.0 range
black_ratio_min: 0.92
black_ratio_max: 0.999
orange_ratio: 0.06

# ---------------- Debug ----------------
debug: false
debug_dir: debug

# ---------------- Environment variables (override at runtime, no config edit needed) ----------------
# BGIA_OPTION_MODE   : first / second / last / random / none
# BGIA_CHOOSE_OPTION : true / false (whether to auto-choose options)
# e.g. BGIA_OPTION_MODE=second python run.py
